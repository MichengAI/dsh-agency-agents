name: 发布 npm 包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  publish:
    needs: check
    name: 发布已验证构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 清除仓库中的旧构建
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $buildPath = Join-Path $env:GITHUB_WORKSPACE 'lib'
          if (Test-Path -LiteralPath $buildPath) {
            Remove-Item -LiteralPath $buildPath -Recurse -Force
          }

      - name: 下载门禁验证的构建
        uses: actions/download-artifact@v4
        with:
          name: verified-lib
          path: lib/

      - name: 校验版本标签
        run: |
          node <<'NODE'
          const version = require('./package.json').version
          const expected = `v${version}`
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`版本标签 ${process.env.GITHUB_REF_NAME} 必须与 package.json 的 ${expected} 一致`)
          }
          NODE

      - name: 发布前校验双语发行说明
        run: node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: 发布到 npm
        # 门禁已执行所有生命周期检查，使用同一次运行的构建，避免再次执行 prepublishOnly。
        run: npm publish --ignore-scripts

  release-notes:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
